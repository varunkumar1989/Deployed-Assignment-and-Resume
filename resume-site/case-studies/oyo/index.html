<style>/* Phone frame and concept-screen components. Everything is in em so a frame scales by font-size. */
.ph{--r:#e8292b;--ink:#17171c;--mu:#6b6b76;--ln:#e6e6ea;--soft:#f4f4f6;--ok:#1e8e5a;--okbg:#e6f4ec;--err:#c62828;--errbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4dc;
  font-size:13px;width:23em;border-radius:2.6em;background:#0d0d10;padding:.55em;box-shadow:0 1.2em 2.6em rgba(0,0,0,.22);flex:none}
.ph .s{position:relative;border-radius:2.1em;overflow:hidden;background:#fff;aspect-ratio:9/19.5;color:var(--ink);font-family:Inter,system-ui,sans-serif}
.ph .s>img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.ph.mini{font-size:6.6px}
.c{position:absolute;inset:0;display:flex;flex-direction:column;font-size:1em;line-height:1.35}
.c .sb{display:flex;justify-content:space-between;padding:.9em 1.6em .3em;font-weight:600;font-size:.85em}
.c .hd{display:flex;align-items:center;gap:.7em;padding:.5em 1.2em .7em;border-bottom:1px solid var(--ln)}
.c .hd b{font-size:1.15em;font-weight:800}
.c .lg{color:var(--r);font-weight:900;font-size:1.3em;letter-spacing:-.02em}
.c .bd{flex:1;overflow:auto;padding:1em 1.2em;display:flex;flex-direction:column;gap:.75em}
.c .cf{padding:.8em 1.2em 1.3em;display:flex;gap:.6em}
.c h3{font-size:1.35em;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:0}
.c p{margin:0;color:var(--mu);font-size:.92em}
.c .btn{flex:1;border:0;border-radius:.7em;padding:.95em;font:700 1em Inter,sans-serif;background:var(--ink);color:#fff;cursor:pointer;text-align:center}
.c .btn.r{background:var(--r)}.c .btn.g{background:#fff;color:var(--ink);border:1px solid var(--ln)}
.c .bd>.btn{flex:none}
.c .btn[disabled]{background:#c9c9cf;color:#fff;cursor:not-allowed}
.c .card{background:var(--soft);border-radius:.8em;padding:.8em;display:flex;flex-direction:column;gap:.5em}
.c .chk{display:flex;gap:.6em;align-items:flex-start;font-size:.95em}
.c .chk i{flex:none;width:1.3em;height:1.3em;border-radius:50%;background:var(--ok);color:#fff;font-style:normal;font-size:.75em;display:flex;align-items:center;justify-content:center;margin-top:.15em}
.c .fld{display:flex;flex-direction:column;gap:.25em}
.c .fld label{font-size:.78em;font-weight:700;color:var(--mu)}
.c .fld label em{color:var(--r);font-style:normal}
.c .in{border:1.5px solid var(--ln);border-radius:.6em;padding:.65em .7em;font-size:.95em;background:#fff}
.c .in.bad{border-color:var(--err);background:var(--errbg)}.c .in.good{border-color:var(--ok)}
.c .msg{font-size:.78em;font-weight:600}.c .msg.e{color:var(--err)}.c .msg.o{color:var(--ok)}
.c .note{border-radius:.7em;padding:.65em .8em;font-size:.85em;font-weight:600}
.c .note.w{background:var(--warnbg);color:var(--warn)}.c .note.o{background:var(--okbg);color:var(--ok)}.c .note.e{background:var(--errbg);color:var(--err)}
.c .stp{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.c .stp .ctl{display:flex;align-items:center;gap:.4em}
.c .stp button{width:2.6em;height:2.6em;border-radius:.6em;border:1.5px solid var(--ln);background:#fff;font:700 1.2em Inter,sans-serif;cursor:pointer;color:var(--ink)}
.c .stp output{min-width:2.6em;text-align:center;font-weight:800;font-size:1.15em}
.c .otp{display:flex;gap:.6em;justify-content:center}.c .otp span{width:2.6em;height:3em;border:1.5px solid var(--ok);border-radius:.6em;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2em;background:var(--okbg)}
.c .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}.c .thumbs span{aspect-ratio:4/3;border-radius:.4em;background:linear-gradient(135deg,#c9b8a3,#8e7a63)}
.c .thumbs span.dup{outline:2px solid var(--err);outline-offset:-2px}.c .thumbs span.b{background:linear-gradient(135deg,#a9c0cf,#5e7a8e)}.c .thumbs span.c2{background:linear-gradient(135deg,#d6c48f,#a08343)}
.c .tl{display:flex;flex-direction:column;gap:.6em}.c .tl div{display:flex;gap:.6em;align-items:center;font-size:.92em}
.c .tl i{flex:none;width:1.4em;height:1.4em;border-radius:50%;border:2px solid var(--ln);font-style:normal}.c .tl i.d{background:var(--ok);border-color:var(--ok)}.c .tl i.n{border-color:var(--r)}
.c .row{display:flex;justify-content:space-between;gap:.6em;font-size:.92em}
.c .tag{display:inline-block;font-size:.72em;font-weight:800;letter-spacing:.04em;padding:.25em .55em;border-radius:.4em}
.c .tag.o{background:var(--okbg);color:var(--ok)}.c .tag.w{background:var(--warnbg);color:var(--warn)}.c .tag.r{background:var(--r);color:#fff}
.c .tabs2{display:flex;gap:1.2em;font-size:.88em;font-weight:700;color:var(--mu);border-bottom:1px solid var(--ln);padding-bottom:.4em}.c .tabs2 b{color:var(--ink);border-bottom:2px solid var(--r);padding-bottom:.3em}
.c .img{border-radius:.7em;background:linear-gradient(135deg,#7d4b3a,#d39a6a);min-height:7em}
.c .img.b{background:linear-gradient(135deg,#3f5f7a,#8fb3c9)}.c .img.c3{background:linear-gradient(135deg,#5b6b3a,#b9c48a)}
.c .pill{display:inline-flex;gap:.3em;align-items:center;border:1px solid var(--ln);border-radius:2em;padding:.35em .75em;font-size:.82em;font-weight:600;background:#fff}
.c .opt{border:1.5px solid var(--ln);border-radius:.7em;padding:.7em;display:flex;justify-content:space-between;align-items:center;gap:.6em;cursor:pointer;background:#fff;font:inherit;color:inherit;text-align:left;width:100%}
.c .opt.on{border-color:var(--r);background:#fff5f5}
.c .nav{display:flex;border-top:1px solid var(--ln);padding:.55em 0 1em}.c .nav span{flex:1;text-align:center;font-size:.75em;font-weight:700;color:var(--mu)}.c .nav span.on{color:var(--r)}
</style>
<style>
/* Layout: an app shell. Desktop = sticky sidebar with the 10 pages grouped Understand / Diagnose / Solve / Prove;
   phone = top bar + stage sub-tabs + bottom tab bar. Every page: question it answers, content, pager. */
:root{
  --bg:#f7f5f1;--surface:#ffffff;--surface-2:#efebe4;--ink:#16151b;--mu:#5d5b66;--line:#e2ddd4;
  --brand:#e8292b;--brand-ink:#c4191c;--on-brand:#ffffff;--guest:#2457d6;--guest-bg:#e8eefc;--owner:#7c3aed;--owner-bg:#f0e9fe;
  --ok:#157a4b;--ok-bg:#e2f3e9;--s4:#7a1513;--s3:#e8292b;--s2:#c06505;--s1:#7b808a;
  --obs:#1d4e89;--obs-bg:#e3eefb;--res:#7a5200;--res-bg:#fff0d6;--hyp:#5b2aa0;--hyp-bg:#efe6fb;
  --stage:#ebe6dd;--shadow:0 1px 2px rgba(22,21,27,.06),0 8px 24px rgba(22,21,27,.06);
  --display:"Bricolage Grotesque",Figtree,system-ui,sans-serif;--body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --side:280px;--topbar:56px;--botbar:64px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121116;--surface:#1b1a21;--surface-2:#24232b;--ink:#f2f0ee;--mu:#a9a6b2;--line:#2f2d36;
  --brand:#ff4b4d;--brand-ink:#ff7a7c;--guest:#7fa3ff;--guest-bg:#1b2645;--owner:#b892ff;--owner-bg:#2a1d45;--ok:#5fd09b;--ok-bg:#163829;--s1:#8c919c;
  --obs:#9cc4f2;--obs-bg:#17304f;--res:#f2c46d;--res-bg:#3a2d10;--hyp:#c9a8f5;--hyp-bg:#2c1d45;--stage:#1f1e25;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121116;--surface:#1b1a21;--surface-2:#24232b;--ink:#f2f0ee;--mu:#a9a6b2;--line:#2f2d36;
  --brand:#ff4b4d;--brand-ink:#ff7a7c;--guest:#7fa3ff;--guest-bg:#1b2645;--owner:#b892ff;--owner-bg:#2a1d45;--ok:#5fd09b;--ok-bg:#163829;--s1:#8c919c;
  --obs:#9cc4f2;--obs-bg:#17304f;--res:#f2c46d;--res-bg:#3a2d10;--hyp:#c9a8f5;--hyp-bg:#2c1d45;--stage:#1f1e25;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--brand-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.022em;line-height:1.08;text-wrap:balance;margin:0}
h1 em,h2 em{font-family:var(--serif);font-weight:400;font-style:italic;color:var(--brand-ink);letter-spacing:-.005em;font-size:1.1em}
p{margin:0}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px}.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:14px;padding:20px 16px 18px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font:800 24px var(--display);color:var(--brand);letter-spacing:-.05em}
.brand span{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.by{font-size:13px;color:var(--mu);margin-top:-8px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px 10px 34px;font:500 14px var(--body);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--mu);fill:none;stroke-width:2}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px var(--body);color:var(--mu);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--surface)}
.results{display:flex;flex-direction:column;gap:2px}
.results button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;width:100%}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results small{display:block;color:var(--mu);font-size:12px}
.results .none{font-size:14px;color:var(--mu);padding:8px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp>span{font:700 10.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mu);padding:8px 10px 4px}
.nav-a{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;width:100%;color:var(--ink)}
.nav-a i{font:800 12px/26px var(--body);font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--surface-2);text-align:center}
.nav-a b{font:600 14.5px/1.2 var(--body);display:block}
.nav-a small{display:block;font-size:12px;color:var(--mu);line-height:1.3;margin-top:2px}
.nav-a:hover{background:var(--surface-2)}
.nav-a[aria-current="page"]{background:var(--ink);color:var(--bg)}.nav-a[aria-current="page"] i{background:var(--brand);color:var(--on-brand)}.nav-a[aria-current="page"] small{color:inherit;opacity:.75}
.docs{display:flex;flex-direction:column;gap:6px;margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.doc{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.doc:hover{border-color:var(--brand)}
.doc .ic{flex:none;width:30px;height:36px;border-radius:5px;background:var(--brand);color:var(--on-brand);font:800 9px/36px var(--body);text-align:center;letter-spacing:.04em}
.doc .ic.live{background:var(--ink);color:var(--bg)}
.doc b{font:700 13.5px/1.2 var(--body);display:block}.doc small{font-size:12px;color:var(--mu)}
.prog{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}

.main{min-width:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-top:28px}
.topbar,.subtabs,.botbar{display:none}

/* ---------- page furniture ---------- */
.phead{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
.eyebrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font:700 11.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--brand-ink)}
.eyebrow span+span{color:var(--mu)}
.phead h2{font-size:clamp(28px,4vw,44px);font-weight:800}
.ask{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ask b{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;background:var(--surface-2);border-radius:5px;padding:4px 7px;white-space:nowrap}
.ask span{font:italic 400 clamp(19px,2.3vw,23px)/1.2 var(--serif);color:var(--ink)}
.deep{font-size:14px;color:var(--mu)}.deep a{font-weight:700}
.sec{display:flex;flex-direction:column;gap:18px;margin-bottom:36px}
.sec>h3{font-size:22px;font-weight:800}
.lead{font-size:17.5px;max-width:68ch;color:var(--ink)}
.muted{color:var(--mu)}
.g2,.g3,.g4{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h4{font-size:18px;font-weight:800}
.card.soft{background:var(--surface-2);border-color:transparent}
.card.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}.card.ink .lbl{color:var(--brand)}
.card.good{background:var(--ok-bg);border-color:transparent}
.lbl{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
ul.t{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:4px}
.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:10px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;cursor:pointer;text-align:left;min-width:0}
.pager button small{display:block;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.pager button b{font:800 16.5px var(--display)}
.pager .nx{background:var(--brand);border-color:var(--brand);color:var(--on-brand);text-align:right;justify-self:end}.pager .nx small{color:inherit;opacity:.85}
.pager .pv{justify-self:start}
.pager .mid{font-size:14px;color:var(--mu);text-align:center}
.pager button[disabled]{visibility:hidden}

/* chips */
.id{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;font:800 12px var(--body);color:#fff;flex:none;border:0}
.id.T{background:var(--guest)}.id.O{background:var(--owner)}
:root[data-theme="dark"] .id{color:#121116}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .id{color:#121116}}
button.id{cursor:pointer}
.sev{display:inline-block;font:700 11.5px/1 var(--body);color:#fff;border-radius:5px;padding:4px 7px;white-space:nowrap}
.sev4{background:var(--s4)}.sev3{background:var(--s3)}.sev2{background:var(--s2)}.sev1{background:var(--s1)}
.ev{display:inline-block;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:4px 6px}
.e-Observed{background:var(--obs-bg);color:var(--obs)}.e-Research{background:var(--res-bg);color:var(--res)}.e-Hypothesis{background:var(--hyp-bg);color:var(--hyp)}.e-Concept{background:var(--surface-2);color:var(--brand-ink)}
.law{display:inline-block;font:700 11.5px/1 var(--body);border:1.5px solid currentColor;border-radius:5px;padding:3px 6px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--body);padding:10px 16px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--mu);font:700 14px var(--body);padding:10px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:600 13.5px var(--body);cursor:pointer;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* p1 hero */
.hero{background:var(--brand);color:var(--on-brand);border-radius:24px;padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:30px;align-items:center;overflow:hidden}
.hero h1{font-size:clamp(34px,5.4vw,62px);font-weight:800;letter-spacing:-.04em;line-height:.98}
.hero h1 em{color:inherit;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:7px;text-decoration-color:rgba(255,255,255,.55)}
.hero .eyebrow{color:#ffe1e1}.hero .eyebrow span+span{color:#ffd0d0}
.hero p{font-size:17px;max-width:56ch;opacity:.96}
.hero .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hero .stats div{border-top:1.5px solid rgba(255,255,255,.5);padding-top:6px}
.hero .stats b{display:block;font:800 32px/1 var(--display);font-variant-numeric:tabular-nums}.hero .stats span{font-size:13px;opacity:.92;line-height:1.25;display:block}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .cta .btn{background:#fff;color:#c4191c;border-color:#fff}.hero .cta .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.duo{display:flex;gap:14px;justify-content:center;align-items:flex-start}
.duo .ph{font-size:8.6px;box-shadow:0 18px 40px rgba(60,0,0,.35)}.duo figure{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center}
.duo figure:last-child{margin-top:44px}
.duo figcaption{font:700 12px var(--body);background:rgba(0,0,0,.22);border-radius:999px;padding:4px 10px;white-space:nowrap}
.answer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.answer .card b.n{font:800 13px var(--body);color:var(--brand-ink);letter-spacing:.12em}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tiles button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tiles button:hover{border-color:var(--brand)}
.tiles small{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}

<script>// Single source of truth for the OYO deck, report and artifact.
window.OYO = {
  meta: {
    title: "OYO · List Your Property",
    sub: "UX Evaluation & Redesign: Improving Digital User Flows",
    author: "Varun Kumar",
    disclaimer: "Independent educational UX evaluation. Not affiliated with OYO. Screenshots from a manual walkthrough of the live app; personal data redacted."
  },
  persona: {
    who: "Independent hotel or guest-house owner with 6–30 rooms, listing on OYO for the first time, mostly from a phone.",
    goal: "Get the property listed correctly, once, and know when it goes live.",
    stakes: "Shares identity documents, address, photos and time. A failed listing means a lost business partner for OYO."
  },
  steps: [
    { n: 1, name: "Entry", sub: "Menu → Onboard as a partner", shots: ["s01_menu", "s02_partner"], issues: [] },
    { n: 2, name: "Login & OTP", sub: "Phone number, code", shots: ["s03_login", "s04_otp"], issues: [1, 2] },
    { n: 3, name: "Location", sub: "At your property?", shots: ["s05_address_search"], issues: [3] },
    { n: 4, name: "Address", sub: "Manual address form", shots: ["s06_address_form"], issues: [4] },
    { n: 5, name: "Property info", sub: "Floors, rooms, phone", shots: ["s07_property_info"], issues: [5, 6] },
    { n: 6, name: "Facilities", sub: "Must-have list", shots: ["s08_facilities"], issues: [7] },
    { n: 7, name: "Photos", sub: "6 landscape photos", shots: ["s09_photos"], issues: [8] },
    { n: 8, name: "KYC", sub: "Aadhaar details", shots: ["s10_kyc"], issues: [9] },
    { n: 9, name: "Review", sub: "Confirm details", shots: ["s11_review"], issues: [10] },
    { n: 10, name: "Publish", sub: "Welcome Aboard → My Properties", shots: ["s12_welcome", "s13_listed", "s14_empty"], issues: [11] }
  ],
  issues: [
    { n: 1, old: 5, step: 2, shot: "s04_otp", sev: 2, title: "Submit works before the OTP is entered",
      heur: "#5 Error prevention", law: "Jakob's Law",
      seen: "On “Confirm your number”, Submit stays active with all four boxes empty. Tapping it shows “ERR-INC-843-9: We are experiencing some issue. Please try later.” The flow also asks for a fresh phone login inside an app that is already signed in.",
      why: "The button invites an error that should never be reachable, and the message is an internal code, not guidance.",
      fix: ["Keep Submit disabled until all 4 digits are in", "Auto-read the SMS code; reuse the existing session", "Say “That code is incorrect or expired” in plain words"] },
    { n: 2, old: 6, step: 2, shot: "s03_login", sev: 3, title: "“Rate Limit Exceeded” with no retry time",
      heur: "#9 Help users recover from errors", law: "",
      seen: "After a few attempts the login screen shows “Rate Limit Exceeded”. It does not say how long the block lasts or what to do meanwhile.",
      why: "The owner is stopped with no way forward and no idea when to try again.",
      fix: ["“Too many attempts. Try again in 15:00” with a countdown", "Offer Login with Apple or a support callback"] },
    { n: 3, old: 7, step: 3, shot: "s05_address_search", sev: 2, title: "“Yes, I'm at my property” still means typing the address",
      heur: "#2 Match with the real world", law: "Hick's Law",
      seen: "The flow asks “Are you at your property's location right now?” Choosing Yes leads to the same manual address search as No.",
      why: "The question promises auto-detection that never happens, and it adds a decision that changes nothing.",
      fix: ["If Yes and location is allowed, pre-fill the address from GPS", "Otherwise remove the question"] },
    { n: 4, old: 8, step: 4, shot: "s06_address_form", sev: 3, title: "Address form accepts junk; required fields are unmarked",
      heur: "#5 Error prevention", law: "",
      seen: "The form accepted a home title of “@” and a street of “67&£4” (alphabetic postal codes were also accepted in testing). No field is marked required, postal code says “Optional”, and Confirm Address stays active.",
      why: "Meaningless data flows into a live listing, and owners cannot tell which fields matter.",
      fix: ["Validate each field inline; numeric 6-digit PIN", "Mark required fields", "Enable Confirm only when the form is valid"] },
    { n: 5, old: 9, step: 5, shot: "s07_property_info", sev: 2, title: "Floors value is cut off, uncapped and later changed",
      heur: "#1 Visibility of system status", law: "Fitts's Law",
      seen: "The floors stepper shows “10(”, clipped between small − and + buttons. It accepted 99,999 floors in testing, and the review later showed 100.",
      why: "The owner cannot see the number they are setting, and the cramped controls make precise input hard.",
      fix: ["Show the full value; cap floors at a realistic maximum", "44 × 44 pt stepper buttons, or a numeric field"] },
    { n: 6, old: 10, step: 5, shot: "s07_property_info", sev: 3, title: "“Minimum 6 rooms” rule appears only after Continue",
      heur: "#10 Help & documentation", law: "",
      seen: "After entering 1–2 rooms and tapping Continue, a red banner says “OYO does not onboard properties less than 6 rooms.” The rule is stated nowhere earlier.",
      why: "Ineligible owners invest effort (login, address, details) before learning they cannot list.",
      fix: ["State eligibility on the first screen", "Show “Minimum 6 rooms” beside the rooms field"] },
    { n: 7, old: 11, step: 6, shot: "s08_facilities", sev: 2, title: "Facilities are a fixed list; Next means agreeing to install them",
      heur: "#7 Flexibility & efficiency of use", law: "",
      seen: "Must-have facilities (Wi-Fi, Geyser, Power backup, Elevator, Kitchen, CCTV, Fire extinguisher) cannot be marked absent, and nothing can be added. A footnote says tapping Next means agreeing to install them.",
      why: "Listings become inaccurate, and owners commit to installations they never offered.",
      fix: ["Mark each facility Available / Not available", "Add “Other facility”", "Ask for consent explicitly, not via Next"] },
    { n: 8, old: 12, step: 7, shot: "s09_photos", sev: 2, title: "Photo rules appear only after a rejected upload",
      heur: "#10 Help & documentation", law: "",
      seen: "Portrait photos are rejected only after upload. Guidance sits behind a small blue bulb icon. Six identical, irrelevant images were accepted and Continue stayed active.",
      why: "Owners learn the rules by failing, and the listing can still go out with useless photos.",
      fix: ["Show photo rules and examples before upload", "Flag duplicates and off-topic images"] },
    { n: 9, old: 13, step: 8, shot: "s10_kyc", sev: 3, title: "KYC accepts a fake name, invalid number and non-ID images",
      heur: "#5 Error prevention", law: "",
      seen: "The step is labelled mandatory under government rules, yet it accepted the name “Doremon Mishra”, an Aadhaar number in an invalid format and two map screenshots as ID images.",
      why: "A legally significant step performs no checks: a data-integrity and compliance risk.",
      fix: ["Check Aadhaar format and checksum", "Verify the document image (OCR) and name match", "Continue only when KYC passes"] },

${TC.FIX[k].map(x => { const it = TI(x); return `<div class="note">${id(x)}<div><b>Fixes ${x}: ${it.title}</b><small>${it.heur}${it.law ? " · " + it.law : ""}</small></div></div>`; }).join("")}
<div class="row"><button class="btn" id="tback" ${i === 0 ? "disabled" : ""}>Back</button><button class="btn p" id="tnext" ${i === list.length - 1 ? "disabled" : ""}>Next screen</button><button class="btn" id="trestart">Restart</button></div></div></div></div>
<div class="sec"><h3>Five standout features, and why I built them</h3><p class="muted">Tap a feature to see how it works and open its screen on the phone. Ratings are mine: 10 is the best pattern I found in public teardowns.</p>
<div class="stand">${F.tStand.map(s => standCard(s, "var(--guest)", S.tsel, "tsel")).join("")}</div>${detail(sel, "var(--guest)")}
<div class="g3">${F.tSupport.map(s => `<div class="card soft"><h4>${s.name} ${s.fixes.map(idS).join("")}</h4><p class="muted">${s.text}</p></div>`).join("")}</div></div>`); }

// ---------- 9 owner solution ----------
const OTIP = { start: "Try it: set rooms below 6 to see the eligibility message.", address: "Try it: tap “Fix fields (demo)” and Confirm unlocks.", info: "Try it: the steppers are 44 pt and capped." };
function r9() { const k = CONCEPT.order[S.cx], sel = F.oStand.find(s => s.id === S.osel);
  fill(9, `${head(9, "List once, correctly, and know the <em>real status</em>")}
<div class="sec"><p class="muted">The listing flow with every fix applied. A clickable concept with sample data, not OYO's screens.</p>
<div class="stepper" role="group" aria-label="Owner concept steps">${CONCEPT.order.map((key, n) => `<button data-cxgo="${n}" ${S.cx === n ? 'aria-current="step"' : ""}><small>STEP ${n + 1}</small>${CONCEPT.labels[key]}</button>`).join("")}</div>
<div class="stage"><div class="phonewrap"><div class="ph"><div class="s" id="cscr">${CONCEPT.C[k]()}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ""}</div></div></div>
<div class="side2"><div class="eyebrow"><span>Owner · step ${S.cx + 1} of ${CONCEPT.order.length}</span><span>${ev("Concept")}</span></div><h3>${CONCEPT.labels[k]}</h3>
${CONCEPT.fixes[k].map(f => { const i = D.issues[f - 1]; return `<div class="note">${id(f)}<div><b>Fixes O${f}: ${i.title}</b><small>${i.fix.join("; ")}.</small></div></div>`; }).join("")}
<p class="muted">${OTIP[k] || "Tap the red button on the phone to continue."}</p>
<div class="row"><button class="btn" id="cback" ${S.cx === 0 ? "disabled" : ""}>Back</button><button class="btn p" id="cnext" ${S.cx === CONCEPT.order.length - 1 ? "disabled" : ""}>Next screen</button><button class="btn" id="crestart">Restart</button></div></div></div></div>
<div class="sec"><h3>Five standout features, and why I built them</h3><p class="muted">Tap a feature to see how it works and open its screen on the phone.</p>
<div class="stand">${F.oStand.map(s => standCard(s, "var(--owner)", S.osel, "osel")).join("")}</div>${detail(sel, "var(--owner)")}</div>
<div class="sec"><h3>Why the whole design is shaped this way</h3><div class="g2">${F.designBeliefs.map(b => `<div class="card"><h4>${b[0]}</h4><p class="muted">${b[1]}</p></div>`).join("")}</div>
<h3>One design system for both sides</h3><div class="g3">${T.principles.map(p => `<div class="card soft"><h4>${p[0]}</h4><p class="muted">${p[1]}</p></div>`).join("")}</div></div>`); }

// ---------- 10 plan ----------
function r10() { const ord = a => a.slice().sort((x, y) => ((x[0] === "T" ? 0 : 100) + +x.replace(/\D/g, "")) - ((y[0] === "T" ? 0 : 100) + +y.replace(/\D/g, "")));
  const brow = (s, side, c) => `<tr><td><b>${s.name}</b><br><span class="muted" style="font-size:13px">${side}</span></td><td style="font-variant-numeric:tabular-nums">${s.today} → <b style="color:${c}">${s.after}</b></td><td><b>${s.bench.who}</b> · ${s.bench.text}</td><td>${s.fixes.map(id).join(" ")}</td></tr>`;
  fill(10, `${head(10, "Make every status true first, <em>then remove friction</em>")}
<div class="sec"><div class="tw"><table><thead><tr><th>Priority</th><th>Theme</th><th>For</th><th>Issues</th><th>Why</th></tr></thead><tbody>${T.priorities.map(p => `<tr><td><span class="ptag ${p.p}">${p.p}</span></td><td><b>${p.theme}</b></td><td>${p.who}</td><td><span class="row">${ord(p.items).map(id).join("")}</span></td><td>${p.why}</td></tr>`).join("")}</tbody></table></div>
<p class="muted"><b style="color:var(--ink)">How I ranked:</b> severity × people affected × risk to OYO (money, stays, listings, legal), weighed against effort. P1 loses money or trust outright; P3 is friction, not failure.</p>
<h3>Release order</h3><div class="seq">${[["Truth", "Save listings before success; hotel-confirmed status", ["T5", "O11"]], ["Clarity", "Totals and rules before paying; validate owner inputs", ["T2", "T3", "O4", "O9"]], ["Recovery", "Refund tracker; support with a human", ["T8", "T6"]], ["Speed", "Book again, login at booking, owner rules up front", ["T7", "T4", "O6"]], ["Polish", "Menu and control fixes", ["T1", "O5"]]].map((s, i) => `<div><small>STEP ${i + 1}</small><b>${s[0]}</b><span>${s[1]}</span><span class="row" style="margin-top:4px">${s[2].map(idS).join("")}</span></div>`).join("")}</div></div>
<div class="sec"><h3>Benchmark scorecard</h3><p class="muted">${F.scoreNote}</p><div class="tw"><table><thead><tr><th>Feature</th><th>Score</th><th>10/10 reference</th><th>Fixes</th></tr></thead><tbody>${F.tStand.map(s => brow(s, "Guest", "var(--guest)")).join("")}${F.oStand.map(s => brow(s, "Owner", "var(--owner)")).join("")}</tbody></table></div></div>
<div class="sec"><div class="g3"><div class="card"><h4>Guest metrics</h4><ul class="t">${T.metrics.trav.map(m => `<li>${m}</li>`).join("")}</ul></div><div class="card"><h4>Owner metrics</h4><ul class="t">${T.metrics.own.map(m => `<li>${m}</li>`).join("")}</ul></div><div class="card"><h4>Guardrails</h4><ul class="t">${T.metrics.guard.map(m => `<li>${m}</li>`).join("")}</ul></div></div>
<div class="tw"><table><thead><tr><th>Who (moderated, think-aloud)</th><th>Task</th><th>Success looks like</th></tr></thead><tbody>${T.tests.map(t => `<tr><td><b>${t.who}</b></td><td>${t.task}</td><td>${t.look}</td></tr>`).join("")}</tbody></table></div>
<div class="card ink"><span class="lbl">Bottom line</span><p style="font-size:18px">${F.bottom}</p></div>
<div class="card"><h4>Research sources</h4><ul class="t">${T.sources.map(s => `<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("")}</ul></div></div>`); }

// ---------- routing & interaction ----------
const R = [null, r1, r2, r3, r4, r5, r6, r7, r8, r9, r10];
function render() { R[S.pg](); }
function go(n, opt = {}) { n = Math.max(1, Math.min(N, +n)); const changed = n !== S.pg; S.pg = n; S.toast = ""; render(); shell(); closeSheet();
  try { history.replaceState(null, "", "#p" + n); } catch (e) {}
  try { localStorage.setItem("oyo-pg", String(n)); } catch (e) {}
  if (opt.anchor) { const el = document.getElementById(opt.anchor); if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1800); return; } }
  if (changed || opt.top) { window.scrollTo(0, 0); $("#content").focus({ preventScroll: true }); } }
let tt; function flash(m) { S.toast = m; render(); clearTimeout(tt); tt = setTimeout(() => { S.toast = ""; render(); }, 2600); }
function tx(cmd) { const st = TC.st, [a, b] = cmd.split(":"), first = S.tmode === "first", list = first ? TC.FIRST : TC.RET;
  const setI = v => { if (S.tmode === "first") S.ft = v; else S.rt = v; }, cur = first ? S.ft : S.rt;
  const goKey = key => { if (TC.FIRST.includes(key)) { S.tmode = "first"; S.ft = TC.FIRST.indexOf(key); } else { S.tmode = "returning"; S.rt = TC.RET.indexOf(key); } r8(); };
  if (a === "next") { setI(Math.min(list.length - 1, cur + 1)); return r8(); } if (a === "prev") { setI(Math.max(0, cur - 1)); return r8(); }
  if (a === "go") { if (b === "r_home" && first) st.booked = true; return goKey(b); }
  if (a === "g-") { st.guests = Math.max(1, st.guests - 1); return r8(); } if (a === "g+") { st.guests = Math.min(3, st.guests + 1); return r8(); }
  if (a === "f") { st.f[b] = !st.f[b]; return r8(); }
  if (a === "hotel") { st.hotel = +b; st.room = 0; if (!TC.H[st.hotel].pay) st.pay = "now"; return goKey("f_hotel"); }
  if (a === "room") { st.room = +b; return r8(); } if (a === "otp") { st.verified = true; return r8(); } if (a === "pay") { st.pay = b; return r8(); } if (a === "bill") { st.open = !st.open; return r8(); }
  if (a === "confirm") { st.booked = true; return goKey("f_confirmed"); }
  if (a === "help") return flash(["Calling the hotel for you now (demo).", "Your total is fixed. Show this screen at the desk (demo).", "Finding a nearby OYO, or refunding in full (demo)."][+b]);
  if (a === "upi") { st.upi = !st.upi; return r8(); } if (a === "rbook") { st.booked = true; st.cancelled = false; return goKey("r_confirmed"); }
  if (a === "rcancel") { st.cancelled = true; return goKey("r_refund"); } if (a === "agent") return flash("Connecting you to an agent. Average wait 2 min (demo).");
  if (a === "star") { st.rating = +b; st.rated = false; return r8(); } if (a === "rate") { st.rated = true; return r8(); } }
const screenForT = key => { if (TC.FIRST.includes(key)) { S.tmode = "first"; S.ft = TC.FIRST.indexOf(key); } else { S.tmode = "returning"; S.rt = TC.RET.indexOf(key); } };
function openIssue(x) { x = nid(x); go(x[0] === "T" ? 5 : 6, { anchor: x }); if (!document.getElementById(x)) { if (x[0] === "T") S.tfil = "all"; else S.ofil = "all"; go(x[0] === "T" ? 5 : 6, { anchor: x }); } }

document.addEventListener("click", e => {
  const t = e.target.closest("button,a,[data-tx],[data-jump]"); if (!t) return; const d = t.dataset;
  if (t.tagName === "A" && d.pg) { e.preventDefault(); return go(d.pg, { top: true }); }
  if (d.tx) return tx(d.tx);
  if (d.issue) return openIssue(d.issue);
  if (d.pg) return go(d.pg, { top: true });
  if (d.sheet) return openSheet();
  if (d.jump) { const [j, n] = d.jump.split(":"); if (j === "owner") { S.own = Math.max(0, OWN.findIndex(o => o.step === +n + 1)); return go(4); } S.tmode = j; if (j === "first") S.ft = +n; else S.rt = +n; return go(8); }
  if (d.ostep) { S.own = OWN.findIndex(o => o.step === +d.ostep); S.toast = ""; return r4(); }
  if (d.ohot !== undefined) { const h = OWN[S.own].hot[+d.ohot]; if (h.end) return flash("End of the observed flow: the listing is gone, with no error and no way to recover it."); S.own = Math.min(OWN.length - 1, S.own + 1); S.toast = ""; return r4(); }
  if (t.id === "oback") { S.own = Math.max(0, S.own - 1); return r4(); } if (t.id === "onext") { S.own = Math.min(OWN.length - 1, S.own + 1); return r4(); } if (t.id === "orestart") { S.own = 0; return r4(); }
  if (d.tfil) { S.tfil = d.tfil; return r5(); } if (d.ofil) { S.ofil = d.ofil; return r6(); }
  if (d.tmode) { S.tmode = d.tmode; S.toast = ""; return r8(); }
  if (d.tgo !== undefined) { if (S.tmode === "first") S.ft = +d.tgo; else S.rt = +d.tgo; return r8(); }
  if (t.id === "tback") return tx("prev"); if (t.id === "tnext") return tx("next");
  if (t.id === "trestart") { TC.reset(); if (S.tmode === "first") S.ft = 0; else S.rt = 0; return r8(); }
  if (d.tsel) { S.tsel = d.tsel; screenForT(F.tStand.find(s => s.id === d.tsel).screen); r8(); $(".phonewrap").scrollIntoView({ block: "nearest" }); return; }
  if (d.osel) { S.osel = d.osel; S.cx = CONCEPT.order.indexOf(F.oStand.find(s => s.id === d.osel).screen); r9(); $(".phonewrap").scrollIntoView({ block: "nearest" }); return; }
  if (d.cxgo !== undefined) { S.cx = +d.cxgo; return r9(); }
  if (d.cx) { const st = CONCEPT.st; if (d.cx === "next") { S.cx = Math.min(CONCEPT.order.length - 1, S.cx + 1); return r9(); } if (d.cx === "restart") { st.rooms = 8; st.floors = 3; st.fixed = false; S.cx = 0; return r9(); } if (d.cx === "fix") { st.fixed = true; return r9(); }
    if (d.cx === "rooms-") st.rooms = Math.max(1, st.rooms - 1); if (d.cx === "rooms+") st.rooms = Math.min(99, st.rooms + 1); if (d.cx === "floors-") st.floors = Math.max(1, st.floors - 1); if (d.cx === "floors+") st.floors = Math.min(50, st.floors + 1); return r9(); }
  if (t.id === "cback") { S.cx = Math.max(0, S.cx - 1); return r9(); } if (t.id === "cnext") { S.cx = Math.min(CONCEPT.order.length - 1, S.cx + 1); return r9(); }
  if (t.id === "crestart") { const st = CONCEPT.st; st.rooms = 8; st.floors = 3; st.fixed = false; S.cx = 0; return r9(); }
  if (d.seefix) { screenForT([...TC.FIRST, ...TC.RET].find(k => TC.FIX[k].includes(d.seefix))); const s = F.tStand.find(s => s.fixes.includes(d.seefix)); if (s) S.tsel = s.id; return go(8); }
  if (d.openshot) { S.own = Math.max(0, OWN.findIndex(o => o.shot === d.openshot)); return go(4); }
  if (d.openfix) { const n = +d.openfix; S.cx = Math.max(0, CONCEPT.order.findIndex(k => CONCEPT.fixes[k].includes(n))); const s = F.oStand.find(s => s.fixes.includes("O" + n)); if (s) S.osel = s.id; return go(9); }
  if (d.hit) { const [kind, v] = d.hit.split(":"); $("#q").value = ""; $("#q2").value = ""; search(""); search2("");
    if (kind === "page") return go(v, { top: true }); if (kind === "issue") return openIssue(v);
    if (kind === "ts") { S.tsel = v; screenForT(F.tStand.find(s => s.id === v).screen); return go(8); }
    if (kind === "os") { S.osel = v; S.cx = CONCEPT.order.indexOf(F.oStand.find(s => s.id === v).screen); return go(9); } }
  if (t.id === "opensheet") return openSheet(); if (t.id === "closesheet") return closeSheet();
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { const j = e.target.closest && e.target.closest("[data-jump]"); if (j) { e.preventDefault(); j.click(); } }
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); if (getComputedStyle($(".side")).display !== "none") $("#q").focus(); else { openSheet(); } }
  if (e.key === "Escape") closeSheet();
});
document.addEventListener("change", e => { if (e.target.id === "tap") { S.tap = e.target.checked; r4(); } });
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
function openSheet() { $("#sheet").hidden = false; setTimeout(() => $("#q2").focus(), 30); }
function closeSheet() { $("#sheet").hidden = true; }

// ---------- search ----------
const INDEX = [
  ...PG.map(p => ({ k: "page:" + p.n, chip: `<span class="id" style="background:var(--ink);color:var(--bg)">${p.n}</span>`, t: p.name, s: p.q, x: (p.name + " " + p.q + " " + p.tab).toLowerCase() })),
  ...T.issues.map(i => ({ k: "issue:" + i.id, chip: idS(i.id), t: i.title, s: "Guest issue · " + i.stage, x: (i.id + " " + i.title + " " + i.heur + " " + i.stage).toLowerCase() })),
  ...D.issues.map(i => ({ k: "issue:O" + i.n, chip: idS(i.n), t: i.title, s: "Owner issue · " + D.steps[i.step - 1].name, x: ("o" + i.n + " " + i.title + " " + i.heur + " " + D.steps[i.step - 1].name).toLowerCase() })),
  ...F.tStand.map(s => ({ k: "ts:" + s.id, chip: `<span class="id T">★</span>`, t: s.name, s: "Guest feature · " + s.line, x: (s.name + " " + s.line + " " + s.fixes.join(" ")).toLowerCase() })),
  ...F.oStand.map(s => ({ k: "os:" + s.id, chip: `<span class="id O">★</span>`, t: s.name, s: "Owner feature · " + s.line, x: (s.name + " " + s.line + " " + s.fixes.join(" ")).toLowerCase() }))
];
const runSearch = (q, box, nav) => { q = q.trim().toLowerCase(); if (!q) { box.hidden = true; nav.hidden = false; return; }
  const words = q.split(/\s+/), hits = INDEX.filter(r => words.every(w => r.x.includes(w))).slice(0, 12);
  box.innerHTML = hits.map(h => `<button data-hit="${h.k}">${h.chip}<span><b>${h.t}</b><small>${h.s}</small></span></button>`).join("") || `<p class="none">Nothing matches “${esc(q)}”. Try an issue number like T5 or a word like refund.</p>`;
  box.hidden = false; nav.hidden = true; };
const search = q => runSearch(q, $("#res"), $("#sidenav")), search2 = q => runSearch(q, $("#res2"), $("#sheetnav"));
$("#q").addEventListener("input", e => search(e.target.value)); $("#q2").addEventListener("input", e => search2(e.target.value));

// ---------- boot ----------
let start = 1; const h0 = location.hash.match(/^#p(\d+)$/); if (h0) start = +h0[1]; else { try { const v = +localStorage.getItem("oyo-pg"); if (v >= 1 && v <= N) start = v; } catch (e) {} }
TC.reset(); S.pg = start; render(); shell();
</script>
